name: build-windows

# Ручной запуск: вкладка Actions → build-windows → Run workflow.
# Выпуск версии: тег vX.Y.Z — установщик прикрепляется к Release.
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Опубликовать как версию (например v0.4.2). Пусто — только сборка."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    # windows-2022 = Visual Studio 2022 (как в сборках FlClashX); на windows-latest уже VS 18
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build (core + helper + app + installer)
        shell: pwsh
        run: |
          dart setup.dart windows --arch amd64 --env stable 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0 -or -not (Test-Path dist/*setup.exe)) {
            # Errors are surfaced as annotations so they can be read via the API
            $esc = { param($l) ($l -replace '%','%25' -replace "`r",'' ) }
            $errs = Get-Content build.log | Where-Object { $_ -match '(?i)error|exception|failed|not found|⚠️' } | Select-Object -First 40 | ForEach-Object { & $esc $_ }
            Write-Output ("::error title=Error lines::" + ($errs -join '%0A'))
            $tail = Get-Content build.log -Tail 60 | ForEach-Object { & $esc $_ }
            Write-Output ("::error title=Log tail::" + ($tail -join '%0A'))
            # Diagnostics: files produced for CMake and the raw output of the install step
            $files = Get-ChildItem libclash -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName + ' ' + $_.Length }
            Write-Output ("::error title=libclash files::" + (($files | ForEach-Object { & $esc $_ }) -join '%0A'))
            $ErrorActionPreference = 'Continue'
            if (Test-Path build/windows/x64/cmake_install.cmake) {
              $cm = (Get-Command cmake -ErrorAction SilentlyContinue).Source
              if (-not $cm) { $cm = (Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter cmake.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
              Push-Location build/windows/x64
              $inst = & $cm -DBUILD_TYPE=Release -P cmake_install.cmake 2>&1 | Select-Object -Last 40 | ForEach-Object { & $esc ($_.ToString()) }
              Pop-Location
              Write-Output ("::error title=cmake install::" + "cmake=$cm%0A" + ($inst -join '%0A'))
            } else {
              Write-Output "::error title=cmake install::no cmake_install.cmake"
            }
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Tunnexo-windows-amd64
          path: ./dist
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Tunnexo ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ./dist/*
