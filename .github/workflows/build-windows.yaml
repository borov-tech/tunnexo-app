name: build-windows

# Ручной запуск: вкладка Actions → build-windows → Run workflow.
# Выпуск версии: тег vX.Y.Z — установщик прикрепляется к Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build (core + helper + app + installer)
        run: dart setup.dart windows --arch amd64 --env stable

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Tunnexo-windows-amd64
          path: ./dist
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
