<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Открываем Tunnexo</title>
<meta name="theme-color" content="#1A0001">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* Redirect page: the bot sends people here with the app link in the #hash
     (never sent to the server). We open the app and offer manual fallbacks. */
  .open{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));
    background:radial-gradient(420px 300px at 50% 40%,#5A1610 0%,#220102 55%,#120001 100%)}
  .box{max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
  .box h1{font-size:clamp(26px,6vw,34px);margin:6px 0 0}
  .box p{margin:0;color:var(--text2)}
  .box .btn{width:100%}
  .spin{width:96px;height:96px;position:relative}
  .spin i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,90,60,.7);animation:zoomout 1.8s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
  .spin i:nth-child(2){animation-delay:.6s}.spin i:nth-child(3){animation-delay:1.2s}
  .spin svg{position:absolute;left:24px;top:24px}
  @keyframes zoomout{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}
  .small{font-size:14px;color:var(--muted)}
  .err{display:none}
  .bad .ok{display:none}.bad .err{display:flex}
  @media (prefers-reduced-motion:reduce){.spin i{animation:none;opacity:.3}}
</style>
</head>
<body>
<main class="open">
  <div class="box ok">
    <div class="spin" aria-hidden="true"><i></i><i></i><i></i>
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><path d="M39.56 13.1A19 19 0 1 0 39.56 34.9" stroke="#FF5A3C" stroke-width="3.6" stroke-linecap="round"/><path d="M33.19 16.29A12 12 0 1 0 33.19 31.71" stroke="#8A281B" stroke-width="3.6" stroke-linecap="round"/><circle cx="24" cy="24" r="5.5" fill="#FFE3D8"/><path d="M28 24h16" stroke="#FF5A3C" stroke-width="3.6" stroke-linecap="round"/></svg>
    </div>
    <h1 id="title">Открываем приложение…</h1>
    <p>Если ничего не произошло, нажмите кнопку ниже.</p>
    <a class="btn btn-primary" id="open" href="download.html">Открыть приложение</a>
    <button class="btn btn-ghost" id="copy" type="button">Скопировать ссылку подписки</button>
    <p class="small" id="copied" role="status"></p>
    <p class="small">Приложения ещё нет? <a class="link" href="download.html">Скачать Tunnexo</a></p>
  </div>
  <div class="box err" style="flex-direction:column;align-items:center;gap:16px">
    <h1>Ссылка не распознана</h1>
    <p>Вернитесь в бота и нажмите «Подключиться» ещё раз.</p>
    <a class="btn btn-primary" href="https://t.me/tunnexo_vpn_bot" rel="noopener">Открыть бота</a>
    <p class="small"><a class="link" href="download.html">Скачать Tunnexo</a></p>
  </div>
</main>
<script>
(function () {
  var ALLOWED = ['tunnexo', 'happ', 'flclashx', 'flclash', 'clash'];
  var NAMES = { tunnexo: 'Tunnexo', happ: 'Happ', flclashx: 'FlClashX', flclash: 'FlClash', clash: 'приложение' };
  var raw = (location.hash || '').slice(1);
  // Drop the link from the address bar and history right away.
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var link = '';
  try { link = decodeURIComponent(raw); } catch (e) { link = ''; }
  var m = /^([a-z][a-z0-9+.-]*):\/\//i.exec(link);
  var scheme = m ? m[1].toLowerCase() : '';
  if (!link || ALLOWED.indexOf(scheme) === -1) {
    document.body.classList.add('bad');
    return;
  }
  document.getElementById('title').textContent = 'Открываем ' + NAMES[scheme] + '…';
  var open = document.getElementById('open');
  open.href = link;
  open.textContent = 'Открыть ' + NAMES[scheme];

  // The subscription URL itself, for adding it by hand.
  var sub = '';
  try {
    var q = link.indexOf('url=');
    if (q !== -1) sub = decodeURIComponent(link.slice(q + 4).split('&')[0]);
    else { var p = link.replace(/^[a-z0-9+.-]+:\/\/(add\/|import\/)?/i, ''); if (/^https?:\/\//i.test(p)) sub = p; }
  } catch (e) {}
  var copyBtn = document.getElementById('copy');
  var out = document.getElementById('copied');
  if (!/^https?:\/\//i.test(sub)) { copyBtn.style.display = 'none'; }
  copyBtn.addEventListener('click', function () {
    function done() { out.textContent = 'Ссылка скопирована. В приложении: «Добавить профиль» → «URL» → вставьте.'; }
    try {
      navigator.clipboard.writeText(sub).then(done, function () { window.prompt('Скопируйте ссылку:', sub); });
    } catch (e) { window.prompt('Скопируйте ссылку:', sub); }
  });

  setTimeout(function () { location.href = link; }, 250);
})();
</script>
</body>
</html>
